name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Check shell syntax
        run: |
          sh -n install.sh tests/fixtures/curl
          bash -n tests/common.sh tests/install.sh tests/smoke.sh
      - name: Test installation and rollback
        run: bash tests/install.sh
      - name: Install and exercise the latest release
        run: bash tests/smoke.sh

  deploy:
    name: Publish installer
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html install.sh _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - uses: actions/deploy-pages@v5
        id: deployment
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: Verify published installer
        env:
          GOML_INSTALL_SCRIPT_URL: https://gomlang.github.io/install/install.sh
        run: bash tests/smoke.sh
